name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

  release:
    name: Build signed release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    env:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'ANDROID_KEYSTORE_BASE64 is not configured'; exit 1; }
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
          test -s "$RUNNER_TEMP/keystore/release.keystore"
      - name: Build signed APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/release.keystore
        run: |
          ./gradlew --no-daemon clean assembleRelease bundleRelease
      - name: Generate SHA-256 checksums
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk release-files/CloudBackup-${GITHUB_REF_NAME}.apk
          cp app/build/outputs/bundle/release/app-release.aab release-files/CloudBackup-${GITHUB_REF_NAME}.aab
          sha256sum release-files/* | tee release-files/SHA256SUMS.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudBackup-${{ github.ref_name }}
          path: release-files/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
      - name: Publish to Google Play internal track (optional)
        if: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.rakib.backup
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
